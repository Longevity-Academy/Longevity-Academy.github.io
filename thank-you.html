<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #060e1a;
  color: #e8eaed;
  line-height: 1.55;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(0,110,255,0.10), transparent 55%),
    radial-gradient(ellipse at 80% 100%, rgba(51,139,255,0.08), transparent 55%),
    linear-gradient(180deg, #050b14 0%, #0a1730 50%, #050b14 100%);
}

.thankyou-shell {
  width: 100%;
  max-width: 576px;
}

/* ===== Thank You card — copied verbatim from homepage .form-thankyou ===== */
.form-thankyou {
  display: block;
  text-align: center;
  padding: 48px 28px;
  border-radius: 24px;
  background: linear-gradient(160deg, #0a1628 0%, #0d1b2e 50%, #060e1a 100%);
  border: 1px solid rgba(0,110,255,0.18);
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  animation: thankyou-fade 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}
.form-thankyou-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, #006EFF, #338BFF);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 30px rgba(0,110,255,0.35);
}
.form-thankyou-icon svg { width: 34px; height: 34px; color: #fff; }
.form-thankyou-headline {
  font-family: 'Codec Pro', 'Inter', sans-serif;
  font-size: clamp(32px, 4vw, 44px);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
  line-height: 1.1;
}
.form-thankyou-text {
  font-family: 'Inter', sans-serif;
  font-size: 16.5px;
  line-height: 1.65;
  color: rgba(255,255,255,0.78);
  max-width: 460px;
  margin: 0 auto 28px;
}
.form-thankyou-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 32px;
  font-family: 'Codec Pro', 'Inter', sans-serif;
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #fff;
  background: linear-gradient(135deg, #006EFF, #338BFF);
  border-radius: 999px;
  text-decoration: none;
  box-shadow: 0 10px 28px rgba(0,110,255,0.35);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.form-thankyou-cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 36px rgba(0,110,255,0.45);
}
.form-thankyou-cta svg { width: 18px; height: 18px; }
@keyframes thankyou-fade {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (max-width: 720px) {
  .form-thankyou { padding: 40px 22px; }
  .form-thankyou-headline { font-size: 30px; }
  .form-thankyou-text { font-size: 15.5px; }
}
</style>

<main class="thankyou-shell">
  <div class="form-thankyou" id="leadGenV2ThankYou" role="status" aria-live="polite">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

    <a class="form-thankyou-cta" href="/">
